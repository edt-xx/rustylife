[package]
name = "game_of_life"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "game_of_life"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
rayon = "1.10"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
crossbeam-channel = "0.5.15"
jemallocator = "0.5.4"

