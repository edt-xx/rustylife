[package]
name = "game_of_life"
version = "0.1.0"
edition = "2024"

[lib]
name = "game_of_life"
path = "src/lib.rs"

[[bin]]
name = "game_of_life"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
rayon = "1.10"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
ahash = "0.8"
crossbeam-channel = "0.5"

[target.'cfg(not(target_os = "windows"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = "line-directives-only"
#debug = "line-tables-only"
#debug = false
